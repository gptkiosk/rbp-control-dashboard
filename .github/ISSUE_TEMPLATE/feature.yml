name: Feature proposal
description: Propose a bounded improvement or discuss an independent fork.
title: "[feature] "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives, tradeoffs and verification
